<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Send Money — veraetogrex_portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Send Money · zero dependencies · github.com/veraetogrex-portfolio -->
  <section class="tx" id="send" aria-label="Send money to a friend">
    <div class="tx-flood"></div>
    <header class="tx-head">
      <span class="tx-back"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Send</span>
      <span class="tx-bal"><small>Balance</small><b>$2,480.00</b></span>
    </header>

    <div class="tx-friend">
      <div class="tx-ava"><svg viewBox="0 0 132 132" aria-hidden="true"><circle class="rail" cx="66" cy="66" r="62"/><circle class="ring" cx="66" cy="66" r="62"/></svg><span class="face">L</span></div>
      <p class="tx-name">Lena Park</p>
      <p class="tx-handle">@lena · ···· 4821</p>
    </div>
    <p class="tx-bubble">Got it, thank you! 🙌</p>

    <p class="tx-amt"><sup>$</sup>120</p>
    <p class="tx-note">🍜 Dinner at Nori</p>

    <div class="tx-slide" role="slider" aria-label="Slide to send" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
      <span class="tx-fill"></span>
      <span class="tx-label">Slide to send $120</span>
      <span class="tx-thumb"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></span>
    </div>

    <div class="tx-print">
      <div class="tx-paper">
        <h1>Vector · transfer</h1>
        <div class="big">$120.00</div>
        <p><span>To</span>Lena Park</p>
        <p><span>For</span>Dinner at Nori</p>
        <p><span>Fee</span>$0.00</p>
        <p><span>When</span>08 Nov · 21:40</p>
        <div class="tx-bars"></div>
        <span class="tx-stamp">Sent</span>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
